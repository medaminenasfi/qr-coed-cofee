services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cafe
      POSTGRES_PASSWORD: cafe_dev_password
      POSTGRES_DB: qrcafe
    ports:
      - "5432:5432"
    volumes:
      - qrcafe_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cafe -d qrcafe"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  qrcafe_pgdata:
